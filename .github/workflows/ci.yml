name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: plugin/dist
          if-no-files-found: error

  service:
    name: Service (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "service[dev]"
      - run: python -m pytest service/tests -q
        env:
          PAPERLOOM_FAKE_LLM: "1"

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed secrets
        run: |
          set -e
          if grep -rInE "sk-[A-Za-z0-9]{16,}|DEEPSEEK_API_KEY *= *['\"]?[A-Za-z0-9]" \
             --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json . ; then
            echo "Potential secret found"; exit 1
          fi
          echo "No secrets found"
