name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0); must match plugin/manifest.json"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plugin deps
        working-directory: plugin
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: plugin
        run: |
          npm run typecheck
          npm run build

      - name: Install service deps
        run: python -m pip install -e "service[dev]"

      - name: Test service
        env:
          PAPERLOOM_FAKE_LLM: "1"
        run: python -m pytest service/tests -q

      - name: Build XPI and service package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content plugin/manifest.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PaperLoom v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.xpi
            dist/*service*.zip
            dist/updates.json
          fail_on_unmatched_files: false
