[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperloom-service"
version = "0.1.0"
description = "Local service for the PaperLoom Zotero plugin: PDF parsing, DeepSeek translation, contextual chat and research analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pdfminer.six>=20231228",
  "pypdf>=4.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
paperloom-service = "paperloom_service.__main__:main"

[tool.setuptools.packages.find]
include = ["paperloom_service*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
